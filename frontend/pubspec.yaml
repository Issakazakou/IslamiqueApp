name: mon_application
description: "Quiz Islamique : quiz sur le Coran, le Hadith, le Fiqh et la Sira."
# Empêche la publication accidentelle sur pub.dev
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  # AJOUT : traductions des widgets Flutter (calendrier, boutons, RTL arabe...)
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.1
  # AJOUT : mémorise la langue choisie sur le téléphone
  shared_preferences: ^2.2.0
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  confetti: ^0.8.0
  flutter_animate: ^4.5.2
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
